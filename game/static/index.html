<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Constellation Strike</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header id="hud">
    <div class="target">
      <span class="label">Draw</span>
      <span id="target-name">—</span>
    </div>
    <div class="stats">
      <div><span class="label">Score</span> <span id="score">0</span></div>
      <div><span class="label">Left</span> <span id="remaining">88</span></div>
      <div id="strikes" aria-label="strikes"></div>
    </div>
  </header>

  <main id="stage">
    <canvas id="board"></canvas>
    <canvas id="preview"></canvas>

    <div id="preview-caption" class="caption hidden">
      <div id="preview-name"></div>
      <div>Memorise the shape — drawing starts in <span id="countdown">4</span>s</div>
      <button id="skip-preview" class="small">I'm ready</button>
    </div>

    <div id="banner" class="hidden"></div>

    <section id="start" class="overlay">
      <h1>Constellation Strike</h1>
      <p>Draw the constellation you're shown using lines only.<br>
        Get it right for a point. Wrong, or the judge isn't sure, is a strike.<br>
        Five strikes and the game ends. Can you get all 88?</p>
      <button id="start-btn">Start</button>
    </section>

    <section id="gameover" class="overlay hidden">
      <h1>Game over</h1>
      <p class="final">Score: <span id="final-score">0</span> / <span id="final-total">88</span></p>
      <ul id="history"></ul>
      <button id="again-btn">Play again</button>
    </section>
  </main>

  <footer id="tools">
    <button id="draw-btn" class="tool active">✏️ Draw</button>
    <button id="erase-btn" class="tool">🧽 Erase</button>
    <button id="clear-btn" class="tool">Clear</button>
    <button id="submit-btn" class="primary">Submit</button>
  </footer>

  <script src="/static/game.js"></script>
</body>
</html>
